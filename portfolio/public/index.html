<!DOCTYPE html>
<!--
  Define Open Graph XML in html tag so that we can define a preview thumbnail of our choice
 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/portfolioicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:image" content="%PUBLIC_URL%/portfoliopreview.png" />
    <meta
      name="description"
      content="Hi, I'm James Alport and this is my Portfolio!"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/portfolioicon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>James Alport</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
